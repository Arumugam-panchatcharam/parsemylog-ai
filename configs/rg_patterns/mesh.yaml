# Mesh domain grep patterns for ripgrep pre-filtering
# These patterns extract error-class and state-change lines from mesh logs
# before feeding them to Drain3 for template extraction.

domain: mesh

# Log files to scan (glob patterns)
# Leading * handles both clean names and timestamp-prefixed filenames
files:
  - "*wifi_vendor_apps*"
  - "*airties.log*"

# Number of context lines before/after each match
context_lines: 3

# Case-insensitive matching
case_insensitive: true

# Second ripgrep pass on first-pass matches: rg -v -F drops these literals
ignore_literals:
  - "LOG_MERGE_MARKER:"

# Regex patterns (uses rg -e)
regex:
  # Generic error/failure indicators
  - "\\b(err|error|fail(ed|ure)?|warn(ing)?|info(rmation)?|debug(ging)?)\\b"
  - "\\b(timeout|invalid|illegal|incorrect|crash|abort|panic|fatal|critical|reset|restart)\\b"
  - "\\b(core dump|segmentation fault|fatal signal 11|unexpected fatal signal)\\b"
  # Generic auth/disassociation keywords
  - "\\b(deauth(orized)?|disassoc(iat(ed|ion)?)?|disconnect(ed)?|left|removed|kicked|rejected|denied)\\b"
  - "\\b(auth(orized)?|authenticate(d)?|assoc(iate)?|associat(ed|ion)?)\\b"
  - "\\b(eapol|wpa|rsn|802.1x|nl80211|station|auth_alg|pmkid)\\b"
  # Signal quality issues
  - "\\b(lost|weak|degraded|low)\\b"
  # Generic mesh keywords
  - "\\b(backhaul|topology|steer(ing)?|agent|controller|extender|pod|offline|unstable|degrade|conflict|easymesh|ieee1905)\\b"
  # ACS/DFS events
  - "\\b(detect|switch|cac|nop|dfs|acsd|channel)\\b"
  # vendor specific events
  - "airties|ecbd"