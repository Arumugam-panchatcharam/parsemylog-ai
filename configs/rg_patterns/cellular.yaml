# Cellular domain grep patterns for ripgrep pre-filtering
# These patterns extract error-class and state-change lines from cellular logs
# before feeding them to Drain3 for template extraction.

domain: cellular

# Log files to scan (glob patterns)
# Leading * handles both clean names and timestamp-prefixed filenames
files:
  - "*CellularManagerLog.txt*"
  - "*CellularManager[Ll]og.txt*"
  - "*CELLULARMANAGERLog.txt*"

# Number of context lines before/after each match
context_lines: 3

# Case-insensitive matching
case_insensitive: true

# Regex patterns (uses rg -e)
regex:
  # Generic error/failure indicators
  - "\\b(err|error|fail(ed|ure)?|warn(ing)?|info(rmation)?|debug(ging)?)\\b"
  - "\\b(timeout|invalid|illegal|incorrect|crash|abort|panic|fatal|critical|reset|restart)\\b"
  - "\\b(core dump|segmentation fault|fatal signal 11|unexpected fatal signal)\\b"
  # Generic cellular issue keywords (position-independent)
  - "\\b(no.?signal|deregister|unregister|attach.?fail|reg.?fail|unresponsive|not.?detect|absent|locked|drop|lost)\\b"
  # Signal issues
  - "\\b(no.?signal|signal.?(lost|weak|low)|RSSI|RSRP|SINR)\\s*[=:]\\s*-\\d{2,3}\\b"
  # Registration issues
  - "\\b(deregister|unregister|reg.?fail|attach.?fail)\\b"
  # APN/connection issues
  - "\\b(APN|apn)\\s+(fail|reject|error|timeout)\\b"
  # Modem state changes
  - "\\b(modem)\\s+(reset|restart|crash|down|stuck|hang|unresponsive)\\b"
  # SIM issues
  - "\\b(SIM|sim)\\s+(error|fail|not.?detect|absent|locked|invalid)\\b"
  # Failover events
  - "\\b(failover|fallback|switchover)\\b"
  # Data connection
  - "\\b(data|pdp|pdn)\\s+(disconnect|fail|drop|lost)\\b"
  # Firmware issues
  - "\\b(firmware|modem.?fw)\\s+(fail|error|corrupt|mismatch)\\b"
