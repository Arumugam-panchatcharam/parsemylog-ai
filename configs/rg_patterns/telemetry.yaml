domain: telemetry

files:
  - "*WEBPAlog.txt*"
  - "*PARODUSlog.txt*"
  - "*parodusStart-log.txt*"
  - "*parodusAuthResponseLog.txt*"
  - "*RTMessagelog.txt*"
  - "*xconf.txt*"
  - "*dcmProcessing.log*"
  - "*TlsVerify.txt*"
  - "*XDNSlog.txt*"

context_lines: 3
case_insensitive: true

ignore_literals:
  - "LOG_MERGE_MARKER:"

regex:
  # Match error/warning/failure patterns
  - "\\b(err|error|fail(ed|ure)?|warn(ing)?|timeout|invalid|disconnect(ed)?|reject(ed)?|denied|lost|expired|corrupt)\\b"
  # Match ERROR/WARN log levels
  - "\\.(ERR|ERROR|WARN|WARNING|FATAL|CRITICAL)\\b"
  # Match connection/auth failures in telemetry context
  - "\\b(telemetry|webpa|parodus|xconf|rtmessage|rbus|xdns|tls)\\s+(err|error|fail|disconnect|timeout|reject)"
  - "\\b(token|auth|certificate|cloud|upstream|downstream|connection)\\s*(fail|error|expired|invalid|reject|disconnect|lost|denied)"