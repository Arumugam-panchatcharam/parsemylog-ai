domain: telemetry

files:
  - "*telemetry*"
  - "*telemetry2_0.txt*"
  - "*telemetry_marker.txt*"
  - "*WEBPAlog.txt*"
  - "*PARODUSlog.txt*"
  - "*parodusStart-log.txt*"
  - "*parodusAuthResponseLog.txt*"
  - "*RTMessagelog.txt*"
  - "*xconf.txt*"
  - "*dcmProcessing.log*"
  - "*dcmscript.log*"
  - "*TlsVerify.txt*"
  - "*XDNSlog.txt*"

context_lines: 3
case_insensitive: true

literals:
  - "T2"
  - "Telemetry"
  - "Report"
  - "cJSON"
  - "WEBPA_ERR"
  - "PARODUS_DISCONNECT"
  - "WEBPA"
  - "PARODUS"
  - "RTMessage"
  - "xconf"
  - "XDNS"
  - "TlsVerify"

regex:
  - "\\b(err|error|fail(ed|ure)?|timeout|invalid|disconnect(ed)?)\\b"
  - "\\b(telemetry|telemetry_marker|telemetry2_0|webpa|parodus|xconf|rtmessage|rbus|xdns|tls)\\b"
  - "\\b(token|auth|certificate|cloud|upstream|downstream)\\s*(fail|error|expired|invalid|reject|disconnect|lost)?\\b"