# Platform / OS domain grep patterns for ripgrep pre-filtering
# Covers core system-level logs: kernel, boot, memory, selfheal,
# firmware updates, process crashes, NTP, DHCP, Ethernet agent.

domain: platform

# Log files to scan (glob patterns)
# Leading * handles both clean names and timestamp-prefixed filenames
files:
  - "*Consolelog.txt*"
  - "*ArmConsolelog.txt*"
  - "*console-ramoops-0*"
  - "*kernel*"
  - "*systeminfolog*"
  - "*system_eventlog*"
  - "*volatile_eventlog*"
  - "*BootTime.log*"
  - "*SelfHeal*"
  - "*MnetDebug.txt*"
  - "*TDMlog.txt*"
  - "*RXTX100Log.txt*"
  - "*SpeedtestLog.txt*"
  - "*SmartHomeAgentLog.txt*"
  - "*EnrolmentAgentLog.txt*"
  - "*VPNManagerLog.txt*"
  - "*IPv6PrivacyLog.txt*"
  - "*network_snapshot.txt*"
  - "*qos_config.log*"
  - "*rtrouted.log*"
  - "*client.sh-log*"

# Number of context lines before/after each match
context_lines: 3

# Case-insensitive matching
case_insensitive: true

# Second ripgrep pass on first-pass matches: rg -v -F drops these literals
# (same semantics as ripgrep -F; use domain case_insensitive for -i).
ignore_literals:
  - "LOG_MERGE_MARKER:"
  - "CURL_CMD:"
  - "CURL command is :"
  - "CURL_CMD2:"
  - "/SelfHeal.txt.0"
  - "/kernel"
  - "lighttpd.error.log"

# Regex patterns (uses rg -e)
regex:
  # Generic error/failure indicators
  - "\\b(err|error|fail(ed|ure)?|warn(ing)?|info(rmation)?|debug(ging)?)\\b"
  - "\\b(timeout|invalid|illegal|incorrect|crash|abort|panic|fatal|critical|reset|restart)\\b"
  - "\\b(core dump|segmentation fault|fatal signal 11|unexpected fatal signal)\\b"
  # Memory issues
  - "\\b(oom|OOM|out.of.memory|memory|leak|exhausted|oops|BUG)\\b"
  # Process crashes
  - "\\b(crash|exit|kill|died|terminated)\\b"
  # SelfHeal actions
  - "\\bselfheal\\b"
  # Boot failures
  - "\\bboot\\s+(fail|error|timeout|stuck)\\b"
  # CPU/load issues
  - "\\b(cpu|load)\\s+(high|spike|100|stuck)\\b"
  # Firmware/update issues
  - "\\b(firmware|upgrade|update)\\s+(fail|error|abort|corrupt)\\b"
  # NTP sync issues
  - "\\b(ntp|time.?sync)\\s*(fail|error|timeout|unsync)\\b"
  # Ethernet agent issues
  - "\\b(eth|ethernet|link)\\s+(down|fail|flap|lost)\\b"
