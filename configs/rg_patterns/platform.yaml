# Platform / OS domain grep patterns for ripgrep pre-filtering
# Covers core system-level logs: kernel, boot, memory, selfheal,
# firmware updates, process crashes, NTP, DHCP, Ethernet agent.

domain: platform

# Log files to scan (glob patterns)
# Leading * handles both clean names and timestamp-prefixed filenames
files:
  - "*Consolelog.txt*"
  - "*ArmConsolelog.txt*"
  - "*console-ramoops-0*"
  - "*kernel*"
  - "*systeminfolog*"
  - "*system_eventlog*"
  - "*volatile_eventlog*"
  - "*BootTime.log*"
  - "*SelfHeal*"
  - "*MnetDebug.txt*"
  - "*TDMlog.txt*"
  - "*RXTX100Log.txt*"
  - "*SpeedtestLog.txt*"
  - "*SmartHomeAgentLog.txt*"
  - "*EnrolmentAgentLog.txt*"
  - "*VPNManagerLog.txt*"
  - "*IPv6PrivacyLog.txt*"
  - "*network_snapshot.txt*"
  - "*wifi_snapshot.txt*"
  - "*qos_config.log*"
  - "*rtrouted.log*"
  - "*client.sh-log*"

# Number of context lines before/after each match
context_lines: 3

# Case-insensitive matching
case_insensitive: true

# Literal string patterns (fast path, uses rg -F)
literals:
  - "Segmentation fault"
  - "Out of memory"
  - "kernel panic"
  - "FATAL"
  - "SEGFAULT"
  - "core dump"
  - "Bus error"
  - "watchdog"
  - "reboot"
  - "factory reset"
  - "hung_task"
  - "soft lockup"

# Regex patterns (uses rg -e)
regex:
  # Generic error/failure indicators
  - "\\b(err|error|fail(ed|ure)?|crash|abort|panic|timeout)\\b"
  # Generic platform issue keywords (position-independent)
  - "\\b(reboot|restart|shutdown|reset|power.?cycle|hung_task|soft.?lockup|oops|watchdog|unsync|time.?sync)\\b"
  # Memory issues
  - "\\b(oom|OOM|out.of.memory|memory.?(leak|exhausted|low))\\b"
  # Kernel issues
  - "\\b(kernel|hung_task|soft.?lockup|oops|BUG)\\b"
  # Reboot/restart events
  - "\\b(reboot|restart|shutdown|reset|power.?cycle)\\b"
  # Process crash/exit
  - "\\b(process|daemon|service)\\s+(crash|exit|kill|died|terminated)\\b"
  # SelfHeal actions
  - "\\bselfheal\\b"
  # Boot failures
  - "\\bboot\\s+(fail|error|timeout|stuck)\\b"
  # CPU/load issues
  - "\\b(cpu|load)\\s+(high|spike|100|stuck)\\b"
  # Firmware/update issues
  - "\\b(firmware|upgrade|update)\\s+(fail|error|abort|corrupt)\\b"
  # SSP restart
  - "\\bSSP\\s+(restart|crash|exit)\\b"
  # NTP sync issues
  - "\\b(ntp|time.?sync)\\s*(fail|error|timeout|unsync)\\b"
  # Ethernet agent issues
  - "\\b(eth|ethernet|link)\\s+(down|fail|flap|lost)\\b"
