# Core Router domain grep patterns for ripgrep pre-filtering
# Covers the CCSP data-model stack and WAN connectivity:
# PSM data model, WAN/DSL/PPP/GPON managers, STATEINFO,
# routing/firewall/network services.

domain: core_router

# Log files to scan (glob patterns)
# Leading * handles both clean names and timestamp-prefixed filenames
files:
  - "*PSMlog.txt*"
  - "*WANMANAGER[Ll]og.txt*"
  - "*XDSLMANAGER[Ll]og.txt*"
  - "*PPPManager[Ll]og.txt*"
  - "*GponManager[Ll]og.txt*"
  - "*GPONMANAGER[Ll]og.txt*"
  - "*STATEINFOMANAGER[Ll]og.txt*"
  - "*VLANManager[Ll]og.txt*"
  - "*NOTIFY[Ll]og.txt*"
  - "*CCSPCUJOAGENT[Ll]og.txt*"
  - "*CUJOAGENT.log*"
  - "*ETHAGENT[Ll]og.txt*"
  - "*dibbler-client.log*"
  - "*dibbler-server.log*"
  - "*ntpLog.log*"
  - "*FirewallDebug.txt*"
  - "*lighttpd.access.log*"
  - "*lighttpd.error.log*"
  - "*ocsp-support.log*"
  - "*sshlogs.txt*"
  - "*zebra.log*"


# Number of context lines before/after each match
context_lines: 3

# Case-insensitive matching
case_insensitive: true

# Second ripgrep pass on first-pass matches: rg -v -F drops these literals
ignore_literals:
  - "LOG_MERGE_MARKER:"

# Regex patterns (uses rg -e)
regex:
  # Generic error/failure indicators
  - "\\b(err|error|fail(ed|ure)?|warn(ing)?|info(rmation)?|debug(ging)?)\\b"
  - "\\b(timeout|invalid|illegal|incorrect|crash|abort|panic|fatal|critical|reset|restart)\\b"
  - "\\b(core dump|segmentation fault|fatal signal 11|unexpected fatal signal)\\b"
  # Memory issues
  - "\\b(oom|OOM|out.of.memory|memory|leak|exhausted|oops|BUG)\\b"
  # Process crashes
  - "\\b(crash|exit|kill|died|terminated)\\b"
  # SelfHeal actions
  - "\\bselfheal\\b"
  # Generic connectivity/session issue keywords
  - "\\b(disconnect(ed)?|connection.?lost|retry|unreachable|flap|sync.?loss|terminated|deregister)\\b"
  # WAN connectivity
  - "\\b(WAN|wan)\\s+(down|lost|disconnect|fail|flap)\\b"
  - "\\b(IPv4|IPv6|ip)\\s+(fail|error|lost|timeout|unreachable)\\b"
  # DSL/xDSL issues
  - "\\b(DSL|dsl|xdsl|XDSL)\\s+(down|fail|timeout|error|drop|retrain|sync.?loss)\\b"
  # PPP issues
  - "\\b(PPP|ppp|pppoe|PPPoE)\\s+(down|fail|timeout|error|drop|terminated)\\b"
  # GPON issues
  - "\\b(GPON|gpon|ONU|onu)\\s+(down|fail|timeout|error|alarm|deactivat)\\b"
  # Process/SSP restart
  - "\\bSSP\\s+(restart|crash|exit)\\b"
  - "\\b(process|daemon|service)\\s+(crash|exit|kill|died|terminated)\\b"
  # VLAN issues
  - "\\b(vlan|VLAN)\\s+(fail|error|mismatch|missing)\\b"
  # Firmware/download issues
  - "\\b(firmware|download|upgrade)\\s+(fail|error|abort|timeout|corrupt)\\b"
