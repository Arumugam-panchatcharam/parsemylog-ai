# WiFi / Wireless domain grep patterns for ripgrep pre-filtering
# These patterns extract error-class and state-change lines from WiFi logs
# before feeding them to Drain3 for template extraction.

domain: wireless

# Log files to scan (glob patterns)
files:
  - "WiFilog.txt*"
  - "wifi_vendor_driver.log*"
  - "wifi_vendor_hal.log*"
  - "wifi_vendor_hostapd.log*"
  - "wifihealth.txt*"

# Number of context lines before/after each match
context_lines: 3

# Case-insensitive matching
case_insensitive: true

# Literal string patterns (fast path, uses rg -F)
literals:
  - "FATAL"
  - "SEGFAULT"
  - "Segmentation fault"
  - "core dump"
  - "ERROR"
  - "restarted after init"

# Regex patterns (uses rg -e)
regex:
  # Generic error/failure indicators
  - "\\b(err|error|fail(ed|ure)?|timeout|invalid|illegal|crash|abort|panic)\\b"
  # Station events (client left/removed/kicked)
  - "\\b(STA|station|client)\\s+(left|removed|kicked|rejected|denied)\\b"
  # Signal quality issues
  - "\\bsignal\\s+(lost|weak|degraded|low)\\b"
  # Radio/HAL issues
  - "\\b(radio|hal)\\s+(reset|restart|down|fail)\\b"
  # VAP/SSID issues
  - "\\b(VAP|vap|SSID|ssid)\\s+(down|fail|destroy|delete)\\b"
  # DFS events
  - "\\b(DFS|dfs|radar)\\s+(detect|switch|cac|nop)\\b"
  # Channel switch
  - "\\bchannel\\s+(switch|change|dfs)\\b"
  # Authentication/association failures
  - "\\b(auth|assoc|wps)\\s+(fail|reject|deny|disassoc|deauth|disconnect(ed)?)\\b"
  # Driver crash/recovery
  - "\\bdriver\\s+(crash|recovery|reset|stuck|hang)\\b"
  # SSP restart
  - "\\bSSP\\s+(restart|crash|exit)\\b"
