# =============================================================================
# Telemetry 2.0 Report Field Configuration
# =============================================================================
#
# Defines which fields to extract from T2 periodic telemetry reports, how to
# group them for display, and which time-series to plot in the final report.
#
# Each field group has:
#   - label:  Human-readable section heading
#   - fields: List of field definitions with:
#       - key:     TR-181 datamodel path (supports {N} for multi-instance)
#       - label:   Display name
#       - type:    numeric | status | text | bool
#       - plot:    true to include in time-series chart (numeric only)
#       - unit:    Optional unit string (KB, %, kbps, dBm, sec, etc.)
#       - sample:  "first" | "last" | "all"  -- how to pick from semicolon-
#                  separated samples per report.  Default: "first"
#
# The parser auto-expands {N} placeholders to match all numbered instances
# found in the actual report data (e.g. Radio.1, Radio.2).
# =============================================================================

# TR-181 keys are standardised; profile names are user-defined and vary
# across firmware versions, so we extract from ALL profiles.

field_groups:

  # -------------------------------------------------------------------------
  # WiFi Global
  # -------------------------------------------------------------------------
  - label: "WiFi Global"
    fields:
      - key: "Device.WiFi.X_TELEKOM-COM_Enable"
        label: "WiFi Enable"
        type: bool
        sample: last
  
  # -------------------------------------------------------------------------
  # Airties Edge
  # -------------------------------------------------------------------------
  - label: "Airties Edge"
    fields:
      - key: "Device.Services.X_AIRTIES_Edge.Enable"
        label: "Airties Edge Enable"
        type: bool
        sample: last

  # -------------------------------------------------------------------------
  # CUJO Security Agent
  # -------------------------------------------------------------------------
  - label: "CUJO Agent"
    fields:
      - key: "Device.X_RDK_CujoAgent.Enable"
        label: "CUJO Enable"
        type: bool
        sample: last

  # -------------------------------------------------------------------------
  # Cellular Backup
  # -------------------------------------------------------------------------
  - label: "Cellular Backup"
    fields:
      - key: "Device.Cellular.Interface.1.Enable"
        label: "Cellular Enable"
        type: bool
        sample: last

      - key: "Device.Cellular.X_RDK_Status"
        label: "Cellular Backup Status"
        type: status
        sample: last

      - key: "Device.Cellular.X_RDK_DeviceType"
        label: "Cellular Device Type"
        type: text
        sample: last

      - key: "Device.Cellular.Interface.1.X_RDK_RadioSignal.RadioEnvConditions"
        label: "LTE Signal Level"
        type: status
        sample: last

  # -------------------------------------------------------------------------
  # SmartHome
  # -------------------------------------------------------------------------
  - label: "SmartHome"
    fields:
      - key: "Device.Services.X_T-ONLINE-DE_SmartHome.Enable"
        label: "SmartHome Enable"
        type: bool
        sample: last

      - key: "Device.Services.X_T-ONLINE-DE_SmartHome.Status"
        label: "SmartHome Status"
        type: status
        sample: last

  # -------------------------------------------------------------------------
  # Deep Power Down (DPD)
  # -------------------------------------------------------------------------
  - label: "Deep Power Down"
    fields:
      - key: "Device.WiFi.X_TELEKOM-COM_DPD.Activated"
        label: "DPD Activated"
        type: bool
        sample: last

  # -------------------------------------------------------------------------
  # WiFi Radio Status (non-chart status labels)
  # -------------------------------------------------------------------------
  - label: "WiFi Radio"
    fields:
      - key: "Device.WiFi.Radio.{N}.Enable"
        label: "Radio {N} Enabled"
        type: bool

      - key: "Device.WiFi.Radio.{N}.Status"
        label: "Radio {N} Status"
        type: status
        sample: last

      - key: "Device.WiFi.Radio.{N}.Channel"
        label: "Radio {N} Channel"
        type: numeric
        sample: last

      - key: "Device.WiFi.Radio.{N}.OperatingFrequencyBand"
        label: "Radio {N} Band"
        type: text

      - key: "Device.WiFi.Radio.{N}.OperatingChannelBandwidth"
        label: "Radio {N} BW"
        type: text

      - key: "Device.WiFi.Radio.{N}.TransmitPower"
        label: "Radio {N} Tx Power"
        type: numeric
        unit: "%"

  # -------------------------------------------------------------------------
  # WiFi Radio Channel
  # -------------------------------------------------------------------------
  - label: "WiFi Radio Channel"
    fields:
      - key: "Device.WiFi.Radio.{N}.Channel"
        label: "Radio {N} Channel"
        type: numeric
        sample: last
        plot: true

  # -------------------------------------------------------------------------
  # WiFi Radio Noise
  # -------------------------------------------------------------------------
  - label: "WiFi Radio Noise"
    fields:
      - key: "Device.WiFi.Radio.{N}.Stats.Noise"
        label: "Radio {N} Noise"
        type: numeric
        unit: "dBm"
        plot: true

  # -------------------------------------------------------------------------
  # WiFi Radio Utilization
  # -------------------------------------------------------------------------
  - label: "WiFi Radio Utilization"
    fields:
      - key: "Device.WiFi.Radio.{N}.Stats.X_COMCAST-COM_ChannelUtilization"
        label: "Radio {N} Ch Util"
        type: numeric
        unit: "%"
        plot: true

  # -------------------------------------------------------------------------
  # WiFi SSID Status
  # -------------------------------------------------------------------------
  - label: "WiFi SSID"
    fields:
      - key: "Device.WiFi.SSID.{N}.SSID"
        label: "SSID {N} Name"
        type: text

      - key: "Device.WiFi.SSID.{N}.Enable"
        label: "SSID {N} Enabled"
        type: bool

      - key: "Device.WiFi.SSID.{N}.Status"
        label: "SSID {N} Status"
        type: status
        sample: last

      - key: "Device.WiFi.SSID.{N}.Stats.BytesReceived"
        label: "SSID {N} Rx Bytes"
        type: numeric
        unit: "B"
        plot: true

      - key: "Device.WiFi.SSID.{N}.Stats.BytesSent"
        label: "SSID {N} Tx Bytes"
        type: numeric
        unit: "B"
        plot: true

      - key: "Device.WiFi.SSID.{N}.Stats.ErrorsReceived"
        label: "SSID {N} Rx Errs"
        type: numeric
        plot: true

      - key: "Device.WiFi.SSID.{N}.Stats.ErrorsSent"
        label: "SSID {N} Tx Errs"
        type: numeric
        plot: true

  # -------------------------------------------------------------------------
  # Memory
  # -------------------------------------------------------------------------
  - label: "Memory"
    fields:
      # Standard NATCO field names (commonly available across all projects)
      - key: "MemInfoFree"
        label: "Memory Free"
        type: numeric
        unit: "KB"
        plot: true

      - key: "MemInfoTotal"
        label: "Memory Total"
        type: numeric
        unit: "KB"

      - key: "meminfoavailable_split"
        label: "Memory Available"
        type: numeric
        unit: "KB"
        plot: true

      # Fallback TR-181 paths for compatibility
      - key: "Device.DeviceInfo.MemoryStatus.Free"
        label: "Memory Free (TR-181)"
        type: numeric
        unit: "KB"
        plot: true

      - key: "Device.DeviceInfo.MemoryStatus.Total"
        label: "Memory Total (TR-181)"
        type: numeric
        unit: "KB"

      - key: "Device.DeviceInfo.MemoryStatus.Available"
        label: "Memory Available (TR-181)"
        type: numeric
        unit: "KB"
        plot: true

      - key: "Device.DeviceInfo.MemoryStatus.SharedMemory"
        label: "Shared Memory"
        type: numeric
        unit: "KB"
        plot: true

      - key: "Device.DeviceInfo.MemoryStatus.SlabMemory"
        label: "Slab Memory"
        type: numeric
        unit: "KB"
        plot: true

      - key: "Device.DeviceInfo.UpTime"
        label: "Uptime"
        type: numeric
        unit: "sec"
        plot: true

  # -------------------------------------------------------------------------
  # CPU
  # -------------------------------------------------------------------------
  - label: "CPU"
    fields:
      - key: "Device.DeviceInfo.ProcessStatus.CPUUsage"
        label: "CPU Usage"
        type: numeric
        unit: "%"
        sample: all
        plot: true

      - key: "Device.DeviceInfo.ProcessStatus.ProcessNumberOfEntries"
        label: "Process Count"
        type: numeric
        plot: true

  # -------------------------------------------------------------------------
  # DSL / WAN
  # -------------------------------------------------------------------------
  - label: "DSL / WAN"
    fields:
      - key: "Device.DSL.Channel.1.DownstreamCurrRate"
        label: "DSL Downstream"
        type: numeric
        unit: "kbps"
        plot: true

      - key: "Device.DSL.Channel.1.UpstreamCurrRate"
        label: "DSL Upstream"
        type: numeric
        unit: "kbps"
        plot: true

      - key: "Device.Ethernet.Link.1.Status"
        label: "Ethernet Link"
        type: status

      - key: "Device.PPP.Interface.1.ConnectionStatus"
        label: "PPP Status"
        type: status

  # -------------------------------------------------------------------------
  # GPON (status card)
  # -------------------------------------------------------------------------
  - label: "GPON"
    fields:
      - key: "Device.GPON.ConnectionStatus"
        label: "GPON Connection"
        type: status
        sample: last

      - key: "Device.GPON.OperationalState"
        label: "Operational State"
        type: status
        sample: last

      - key: "Device.GPON.RegistrationState"
        label: "Registration"
        type: text
        sample: last

      - key: "Device.GPON.RxSignalLevel"
        label: "Rx Signal"
        type: numeric
        unit: "dBm/10"

      - key: "Device.GPON.TxSignalLevel"
        label: "Tx Signal"
        type: numeric
        unit: "dBm/10"

      - key: "Device.GPON.DownstreamSpeed"
        label: "Downstream"
        type: numeric
        unit: "kbps"

      - key: "Device.GPON.UpstreamSpeed"
        label: "Upstream"
        type: numeric
        unit: "kbps"

      - key: "Device.GPON.FramesLost"
        label: "Frames Lost"
        type: numeric

  # -------------------------------------------------------------------------
  # PPP / WANoE (status card)
  # -------------------------------------------------------------------------
  - label: "PPP / WANoE"
    fields:
      - key: "Device.PPP.Interface.1.ConnectionStatus"
        label: "PPP Status"
        type: status
        sample: last

      - key: "Device.WANoE.ConnectionStatus"
        label: "WANoE Connection"
        type: status
        sample: last

      - key: "Device.WANoE.LastConnError"
        label: "Last Error"
        type: text
        sample: last

      - key: "Device.WANoE.DownstreamSpeed"
        label: "WANoE Downstream"
        type: numeric
        unit: "kbps"

      - key: "Device.WANoE.UpstreamSpeed"
        label: "WANoE Upstream"
        type: numeric
        unit: "kbps"

  # -------------------------------------------------------------------------
  # WAN Traffic (chart)
  # -------------------------------------------------------------------------
  - label: "WAN Traffic"
    fields:
      - key: "Device.WAN.BytesReceived"
        label: "WAN Rx Bytes"
        type: numeric
        unit: "B"
        plot: true

      - key: "Device.WAN.BytesSent"
        label: "WAN Tx Bytes"
        type: numeric
        unit: "B"
        plot: true

      - key: "Device.WAN.PacketsReceived"
        label: "WAN Rx Packets"
        type: numeric
        plot: true

      - key: "Device.WAN.PacketsSent"
        label: "WAN Tx Packets"
        type: numeric
        plot: true

      - key: "Device.WAN.ErrorsReceived"
        label: "WAN Rx Errors"
        type: numeric
        plot: true

      - key: "Device.WAN.ErrorsSent"
        label: "WAN Tx Errors"
        type: numeric
        plot: true

  # -------------------------------------------------------------------------
  # Device Identity & Misc
  # -------------------------------------------------------------------------
  - label: "Device Info"
    fields:
      - key: "Device.DeviceInfo.X_RDKCENTRAL-COM_LastRebootReason"
        label: "Reboot Reason"
        type: text

      - key: "Device.Hosts.X_CISCO_COM_ConnectedDeviceNumber"
        label: "Connected Devices"
        type: numeric
        plot: true

      - key: "Device.Time.Status"
        label: "NTP Status"
        type: text

      - key: "Device.WiFi.X_RDKCENTRAL-COM_BandSteering.Enable"
        label: "Band Steering"
        type: bool
