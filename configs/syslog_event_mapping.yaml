    after a mesh -repeater joined the network and was identified.'
  severity: info
WM004:
  category: wifi
  description: The mesh device with MAC-address <MAC-address> lost connection to the mesh network. — A specific mesh device
    with the MAC-address <MAC-address> lost connection to the mesh network. Means no connected mesh device can communicate
    with this specific mesh device anymore, e.g. because the device was switched off... .
  severity: info
WM005:
  category: wifi
  description: The device or any connected mesh repeater has detected another device in the used channel set. The device needs
    to leave this channel set in order to switch to a another channelset.
  severity: info
WM007:
  category: wifi
  description: The user manually initiated a reboot of any connected mesh repeater and the running mesh process of the mesh
    base itself or for the device itself. — The user manually initiated a reboot of any connected mesh repeater, the running
    mesh process of the mesh base itself or for the device itself by pressing a button within the Web-UI of the mesh base
    or the device.
  severity: info
WM008:
  category: wifi
  description: The user manually initiated a reset to manufacturing default settings of any connected mesh repeater and the
    running mesh process of the mesh base itself. — The user manually initiated a restart of any connected mesh repeater and
    the running mesh process of the mesh base itself by pressing a button within the Web-UI of the mesh base (home gateway).
  severity: info
WM009-1:
  category: wifi
  description: A calculation of the topology of the WiFi mesh network was started by the mesh master. — The mesh base initates
    a (re-)calculation of the WiFi mesh network topology.
  severity: info
WM203:
  category: wifi
  description: WPS action was successfully finished with a DT mesh compatible device — The WPS enrollee was identified as
