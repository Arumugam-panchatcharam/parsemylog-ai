# Syslog Event ID mapping — generated from Smart5 syslog requirements (Description column).
# Source spreadsheet: Smart5SyslogRequirements2023-03-29v3.xlsx
# Event Code / Meaning / Category extracted per row; product category inferred from code + meaning.
# Re-run: python scripts/build_syslog_event_mapping.py

GW001:
  category: wifi
  description: Guest WLAN access with <SSID> has been activated. — WLAN guest access was activated by user saving valid settings.
  severity: info
GW002:
  category: wifi
  description: Guest WLAN access with <SSID> has been deactivated. — WLAN guest access was deactivated after the configured
    activation time was exceeded and no WLAN client was connected anymore.
  severity: info
GW003:
  category: wifi
  description: 'Guest WLAN access is not deactivated after the activation time is exceeded because a WLAN client is still
    connected. — The WLAN guest access is not deactivated because one or more WLAN clients are still connected. (precondition:
    the user has activated this configuration via Web-UI)'
  severity: info
GW004:
  category: wifi
  description: 'WLAN guest station/client successfully connected: Computer name <computer name>, MAC-address: <MAC-address>
    — WLAN station/client authenticated and connected successful to 2.4 GHz SSID or 5.Ghz SSID of the WLAN guest access. Please
    see important note at the end of the chapter.'
  severity: info
GW005:
  category: wifi
  description: 'WLAN guest station/client successfully disconnected: Computer name <computer name>, MAC-address: <MAC-address>,
    IPv4-address <IPv4 address>. — This message occurs if a connected WLAN client is disconnected either because · The regarding
    computer has been switched off or · The regarding computer is out of range or · The WLAN adapter has been removed from
    the computer. or · The WLAN adapter has been deactivated. or · The WLAN client has actively disconnected from the WLAN
    guest access. Please see important note at the end of the chapter.'
  severity: info
MFB101:
  category: wifi
  description: Firmware Update Check for the device and/or mesh system was manually triggered by the user via the Web-UI —
    Availability check of a firmware update for the device itself and/or the connected WiFi-mesh devices was triggered manually
    by the user
  severity: info
MFB102:
  category: wifi
  description: Firmware Update Check for the device and/or mesh system was automatically triggered by reaching the calculated
    point in time to connect to the DTAG-CPE-Information.xml file.
  severity: info
MFB103:
  category: wifi
  description: 'The DT compatible mesh device e.g. Speed Home WiFi, Speed Home WLAN, MagentaTV-Box,... with MAC-address: <MAC-address>
    was requested by the Master to update the FW-Version.'
  severity: info
W001:
  category: wifi
  description: 'WLAN station disconnected from either 2.4Ghz Wifi or 5.0Ghz Wifi radio: Computer name <computer name>, MAC-address:
    <MAC-address> — 1. The regarding computer has been switched off. 2. The regarding computer is out of range 3. The WLAN
    adapter has been removed from the PC 4. The WLAN adapter has been deactivated Please see important note at the end of
    the chapter.'
  severity: info
W003:
  category: wifi
  description: 'WLAN station connection establishment to either 2.4Ghz Wifi or 5.0Ghz Wifi radio failed: association error.
    Data rate not compatible: Computer name <computer name>, MAC-address: <MAC-address>'
  severity: error
W004:
  category: wifi
  description: 'WLAN station connection establishment to either 2.4Ghz Wifi or 5.0Ghz Wifi radio failed: association error.
    MAC address is not allowed: Computer name <computer name>, MAC-address: <MAC-address>'
  severity: error
W005:
  category: wifi
  description: 'WLAN station connection establishment to either 2.4Ghz Wifi or 5.0Ghz Wifi radio failed: Authorisation failed.
    Computer name <computer name>, MAC-address: <MAC-address>'
  severity: error
W006:
  category: wifi
  description: WLAN for either 2.4Ghz Wifi or 5.0Ghz Wifi radio has been activated — WLAN radio for either <2.4 or 5.0> Ghz
