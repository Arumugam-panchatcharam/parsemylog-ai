  severity: info
WM002-1:
  category: wifi
  description: The device claims the master role of the mesh system. — The device claims the master role of the mesh system.
  severity: info
WM003-1:
  category: wifi
  description: 'A DT compatible mesh device e.g. Speed Home WiFi, Speed Home WLAN, MagentaTV-Box,... with MAC-address: <MAC-address>
    was identified in the network. — This message is displayed once after the device was booted and a mesh repeater joined
    the network and got identified with the according hostname.'
  severity: info
WM003-2:
  category: wifi
  description: 'The DT compatible mesh device e.g. Speed Home WiFi, Speed Home WLAN, MagentaTV-Box,... with MAC-address: <MAC-address>
