category_patterns:
- pattern: ^ACSD$
  category: wifi
  default_severity: info
- pattern: WIFI\..*
  category: wifi
  default_severity: info
- pattern: PARODUS\..*
  category: parodus
  default_severity: info
- pattern: DNS.*
  category: dns
  default_severity: info
- pattern: PAM.*
  category: wan
  default_severity: info
- pattern: PPP.*
  category: wan
  default_severity: info
- pattern: WAN.*
  category: wan
  default_severity: info
- pattern: SYS.*
  category: system
  default_severity: info
- pattern: NET.*
  category: network
  default_severity: info
- pattern: DHCP.*
  category: network
  default_severity: info
- pattern: .*\.ERROR
  category: error
  default_severity: error
- pattern: .*\.WARN
  category: warning
  default_severity: warning
- pattern: .*\.INFO
  category: info
  default_severity: info
