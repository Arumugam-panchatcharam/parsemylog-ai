server {
    listen 80;

    # Serve React SPA static files
    root /usr/share/nginx/html;
    index index.html;

    # API requests -> Flask backend
    location /api/ {
        proxy_pass http://logai-api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Match gunicorn --timeout (1800s): cross-CPE pattern scan, analytics, uploads, indexing
        proxy_read_timeout 1800;
        proxy_connect_timeout 60;
        proxy_send_timeout 1800;

        # Large file uploads (up to 2 GB)
        client_max_body_size 2048M;
    }

    # SSE streaming for AI chat — disable buffering for real-time token delivery
    location ~ /api/projects/.+/chat/send$ {
        proxy_pass http://logai-api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;

        # Disable ALL buffering for SSE (Server-Sent Events)
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    # Vite build output lives under /assets — never fall back to index.html here.
    # Fallback would return HTML with a 200 and breaks ES modules ("failed to load module").
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Always revalidate shell HTML so new deploys pick up fresh hashed chunk names.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA routing: non-file routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static file caching (paths outside /assets/, e.g. favicon at root)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}
