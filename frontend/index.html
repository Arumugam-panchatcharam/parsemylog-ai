<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>ParseMyLog AI</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("parsemylog-theme");
          var dark = false;
          if (t === "dark") dark = true;
          else if (t === "light") dark = false;
          else {
            dark =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          if (dark) document.documentElement.classList.add("dark");
          else document.documentElement.classList.remove("dark");
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
