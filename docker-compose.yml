services:
  # Flask REST API backend (Gunicorn) — internal only, accessed via Nginx
  logai-api:
    build: .
    image: parsemylog-ai:latest
    container_name: logai-api
    command: [
      "gunicorn",
      "-w", "4",
      "-b", "0.0.0.0:5000",
      "--timeout", "900",
      "--preload",
      "--access-logfile", "-",
      "--error-logfile", "-",
      "--log-level", "info",
      "logai_api_wsgi:app"
    ]
    volumes:
      # Bind-mount source code — no image rebuild needed for code changes
      - ./api:/app/api:ro
      - ./logai:/app/logai:ro
      - ./services:/app/services:ro
      - ./configs:/app/configs:ro
      - ./scripts:/app/scripts:ro
      - ./logai_api_wsgi.py:/app/logai_api_wsgi.py:ro
      - ./run_api.py:/app/run_api.py:ro
      - ./drain3.ini:/app/drain3.ini:ro
      # OUI database for MAC vendor lookups (bind-mount if exists, otherwise will be downloaded)
      - ./oui.txt:/app/oui.txt
      # Persistent data
      - user_uploads:/app/user_uploads
      - bge_model:/app/bge-small-en-v1.5-local
      - logai_data:/app/data
      # Batch CPE logs - shared with host
      - batch_cpe_logs:/app/batch_cpe_logs
    restart: always
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/logai_users.db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/auth/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # Redis - message broker for Celery task queue
  redis:
    image: redis:7-alpine
    container_name: logai-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: always
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Celery worker - async task processing for batch CPE jobs
  celery-worker:
    build: .
    image: parsemylog-ai:latest
    container_name: celery-worker
    command: [
      "celery",
      "-A", "services.celery_worker.celery_app",
      "worker",
      "--loglevel=info",
      "--concurrency=1",
      "--max-tasks-per-child=50",
      "--prefetch-multiplier=1"
    ]
    volumes:
      # Same source code as API
      - ./api:/app/api:ro
      - ./logai:/app/logai:ro
      - ./services:/app/services:ro
      - ./configs:/app/configs:ro
      - ./scripts:/app/scripts:ro
      - ./drain3.ini:/app/drain3.ini:ro
      # OUI database for MAC vendor lookups
      - ./oui.txt:/app/oui.txt
      # Shared data with API
      - user_uploads:/app/user_uploads
      - bge_model:/app/bge-small-en-v1.5-local
      - logai_data:/app/data
      # Batch CPE logs - shared with host and API
      - batch_cpe_logs:/app/batch_cpe_logs
    restart: always
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/logai_users.db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      logai-api:
        condition: service_started

  # One-shot: build React SPA into frontend_dist volume, then exit.
  # Only runs when explicitly requested (profile: build).
  #   docker-compose --profile build up frontend-build
  frontend-build:
    profiles: ["build"]
    image: node:22-alpine
    container_name: frontend-build
    working_dir: /app
    volumes:
      - ./frontend:/app
      # node_modules persisted so npm install is fast after first run
      - frontend_node_modules:/app/node_modules
      # Build output written here, shared with Nginx
      - frontend_dist:/app/dist
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Installing npm dependencies..."
        npm install --prefer-offline
        echo "Building frontend..."
        npx tsc -b && npx vite build
        echo "Frontend build complete."
    restart: "no"

  # Nginx — serves the built React SPA and proxies /api to Flask
  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    image: parsemylog-nginx:latest
    container_name: nginx
    ports:
      - "${APP_PORT:-40901}:80"
    volumes:
      # Serve the built SPA from the shared volume
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - logai-api
    restart: always

volumes:
  user_uploads:
  logai_data:
  bge_model:
  qdrant_storage:
  redis_data:
  frontend_node_modules:
  frontend_dist:
  # Batch CPE logs - bind mount to host directory for easy access
  # Users can place CPE zip files here for batch processing
  batch_cpe_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BATCH_CPE_LOGS_PATH:-./batch_cpe_logs}
