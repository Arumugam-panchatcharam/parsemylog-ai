services:
  # Flask REST API backend (Gunicorn) — internal only, accessed via Nginx
  logai-api:
    build: .
    image: parsemylog-ai:latest
    container_name: logai-api
    command: [
      "gunicorn",
      "-w", "4",
      "-b", "0.0.0.0:5000",
      "--timeout", "900",
      "--preload",
      "--access-logfile", "-",
      "--error-logfile", "-",
      "--log-level", "info",
      "logai_api_wsgi:app"
    ]
    volumes:
      # Bind-mount source code — no image rebuild needed for code changes
      - ./api:/app/api:ro
      - ./logai:/app/logai:ro
      - ./configs:/app/configs:ro
      - ./logai_api_wsgi.py:/app/logai_api_wsgi.py:ro
      - ./run_api.py:/app/run_api.py:ro
      - ./drain3.ini:/app/drain3.ini:ro
      # Persistent data
      - user_uploads:/app/user_uploads
      - bge_model:/app/bge-small-en-v1.5-local
      - logai_data:/app/data
    restart: always
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/logai_users.db
      - LLM_URL=http://llm:8000/v1
    depends_on:
      qdrant:
        condition: service_started
      llm:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/auth/profile')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # ---- One-shot model downloader (runs only if model is missing) ----
  #   docker-compose --profile setup run --rm llm-init
  llm-init:
    profiles: ["setup"]
    build: ./llm
    container_name: llm-init
    command: /app/download-model.sh
    volumes:
      - llm_models:/models
    restart: "no"

  # ---- LLM inference server (llama-cpp-python, OpenAI-compatible API) ----
  llm:
    build: ./llm
    image: parsemylog-llm:latest
    container_name: llm
    command: >
      python -m llama_cpp.server
      --model /models/qwen2.5-coder-7b-instruct-q4_k_m.gguf
      --host 0.0.0.0
      --port 8000
      --n_ctx 8192
      --n_threads 8
      --use_mlock false
      --chat_format chatml
    volumes:
      - llm_models:/models
    ports:
      - "${LLM_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "8"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # One-shot: build React SPA into frontend_dist volume, then exit.
  # Only runs when explicitly requested (profile: build).
  #   docker-compose --profile build up frontend-build
  frontend-build:
    profiles: ["build"]
    image: node:22-alpine
    container_name: frontend-build
    working_dir: /app
    volumes:
      - ./frontend:/app
      # node_modules persisted so npm install is fast after first run
      - frontend_node_modules:/app/node_modules
      # Build output written here, shared with Nginx
      - frontend_dist:/app/dist
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Installing npm dependencies..."
        npm install --prefer-offline
        echo "Building frontend..."
        npx tsc -b && npx vite build
        echo "Frontend build complete."
    restart: "no"

  # Nginx — serves the built React SPA and proxies /api to Flask
  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    image: parsemylog-nginx:latest
    container_name: nginx
    ports:
      - "${APP_PORT:-40901}:80"
    volumes:
      # Serve the built SPA from the shared volume
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - logai-api
    restart: always

volumes:
  user_uploads:
  logai_data:
  bge_model:
  qdrant_storage:
  llm_models:
  frontend_node_modules:
  frontend_dist:
