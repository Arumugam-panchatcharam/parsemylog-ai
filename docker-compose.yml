services:
  # Flask REST API backend (Gunicorn)
  logai-api:
    build: .
    image: parsemylog-ai:latest
    container_name: logai-api
    command: [
      "gunicorn",
      "-w", "4",
      "-b", "0.0.0.0:40901",
      "--timeout", "360",
      "--preload",
      "--access-logfile", "-",
      "--error-logfile", "-",
      "--log-level", "info",
      "logai_api_wsgi:app"
    ]
    volumes:
      - user_uploads:/app/user_uploads
      - bge_model:/app/bge-small-en-v1.5-local
      - ./configs:/app/configs:ro
      - logai_db:/app/data
    ports:
      - "${APP_PORT:-40901}:40901"
    restart: always
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/logai_users.db
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:40901/api/auth/profile')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # Nginx reverse proxy — builds React SPA and serves it + proxies /api
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: parsemylog-nginx:latest
    container_name: nginx
    ports:
      - "${NGINX_PORT:-8091}:80"
    depends_on:
      - logai-api
    restart: always

volumes:
  user_uploads:
  bge_model:
  qdrant_storage:
  logai_db:
