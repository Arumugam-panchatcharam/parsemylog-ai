services:
  rdk-logai-app:
    build: .
    image: logai-app:1.0
    container_name: rdk-logai-app
    command: ["gunicorn", "-w", "8", "-b", "0.0.0.0:40901", "--timeout", "360", "logai_wsgi:server"]
    volumes:
      - .:/app
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      - qdrant
    restart: always
    env_file:
      - .env
  
  qdrant:
    image: qdrant/qdrant:v1.16.0
    container_name: qdrant
    ports:
      - "${QDRANT_HOST_PORT}:6333"         # Qdrant REST API
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: always
    environment:
      - QDRANT__STORAGE__PATH=/qdrant/storage
      - QDRANT__STORAGE__AUTO_FLUSH_INTERVAL=1   # flush frequently for fast persistence
      - QDRANT__LOG_LEVEL=INFO
  
  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      - rdk-logai-app
    restart: always
    env_file:
      - .env

volumes:
  qdrant_storage:
