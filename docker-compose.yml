services:
  # Flask REST API backend (Gunicorn) — internal only, accessed via Nginx
  logai-api:
    build: .
    image: parsemylog-ai:latest
    container_name: logai-api
    command: [
      "gunicorn",
      "-w", "4",
      "-b", "0.0.0.0:5000",
      "--timeout", "360",
      "--preload",
      "--access-logfile", "-",
      "--error-logfile", "-",
      "--log-level", "info",
      "logai_api_wsgi:app"
    ]
    volumes:
      # Bind-mount source code — no image rebuild needed for code changes
      - ./api:/app/api:ro
      - ./logai:/app/logai:ro
      - ./configs:/app/configs:ro
      - ./logai_api_wsgi.py:/app/logai_api_wsgi.py:ro
      - ./run_api.py:/app/run_api.py:ro
      # Persistent data
      - user_uploads:/app/user_uploads
      - bge_model:/app/bge-small-en-v1.5-local
      - ./logai_users.db:/app/logai_users.db
    restart: always
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/auth/profile')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # Nginx — serves pre-built React SPA and proxies /api to Flask
  # Build frontend first:  cd frontend && npm run build
  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    image: parsemylog-nginx:latest
    container_name: nginx
    ports:
      - "${APP_PORT:-40901}:80"
    volumes:
      # Bind-mount built frontend — rebuild with: cd frontend && npm run build
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - logai-api
    restart: always

volumes:
  user_uploads:
  bge_model:
  qdrant_storage:
